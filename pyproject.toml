[project]
name = "attrex"
version = "0.1.0"
description = "Извлечение и нормализация атрибутов товаров из текста карточки (кейс М.Видео, команда TushavinClub)"
readme = "README.md"
requires-python = ">=3.11,<3.14"  # рабочая версия команды — 3.12 (.python-version)
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
# b1: ноутбуки EDA
eda = ["matplotlib>=3.8", "ipykernel>=6.29", "nbclient>=0.10", "nbformat>=5.10"]
# b2: retrieval-нормализатор (e5-small на CPU)
ml = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
# b3: LLM и эмбеддинги через OpenAI-совместимый API платформы
llm = ["openai>=1.40"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attrex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]
