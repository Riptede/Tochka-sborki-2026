# Параметры пайплайна. Пороги здесь — стартовые значения; калибровка (b2) перезаписывает их по атрибутам.

# Шаги каскада по порядку (CLAUDE.md, «Каскад»): имя шага из Step → модуль с build(ctx) -> Extractor.
# Новый шаг — строка здесь, pipeline.py не меняется. --steps у run_pipeline выбирает подмножество (ablation).
cascade:
  rules: attrex.normalize.rules
  parse: attrex.normalize.kv_parser
  retrieval: attrex.normalize.retrieval
  llm: attrex.llm.extractor              # без llm.enabled, ключа и бюджета шаг ничего не делает
  model_match: attrex.normalize.model_match   # значение из карточек той же модели — всегда на ручную проверку

# Шаг 0 — категория карточки: модуль с build(ctx) -> resolve(card) -> Card. null — только категория из БД
# (фид или клики); карточки без неё получают схему из сквозных атрибутов schema.fallback_required.
category:
  resolver: attrex.category.classifier     # категория из БД, иначе — по первым словам заголовка

# Из эталона каких фолдов строятся словари, раскладки и выученные алиасы. test и holdout_category — никогда.
knowledge_folds: [train]

schema:
  required_fill_rate: 0.70     # фасет обязательный, если заполнен у ≥ 70% офферов категории (EDA, раздел 5)
  min_offers_for_own_schema: 50  # меньше — схема наследуется от родительской категории
  fallback_required: [brand, model, color]   # категория неизвестна: только сквозные атрибуты (EDA, раздел 9)

confidence:
  accept_threshold: 0.75       # выше — в каталог, ниже — дальше по каскаду или на ручную проверку
  category_min_conf: 0.60      # ниже — извлекаем только сквозные атрибуты (scope: global)
  thresholds: {}               # ручной порог по атрибуту: важнее порогов калибровки
  calibration: calibration.yaml  # кривые и пороги калибровки (configs/, генерирует attrex.confidence.calibration)
  step_weights:                # насколько доверяем шагу при сложении подтверждений одного значения
    rules: 1.0
    parse: 1.0
    retrieval: 0.8
    llm: 0.9
    model_match: 0.5

# LLM и эмбеддинги — API платформы хакатона (OpenAI-совместимый). Адрес и ключ берутся из окружения ВМ:
# OPENAI_BASE_URL / OPENAI_API_KEY (их же читает клиент openai). В конфиг и в git ключи не кладём.
# Цены в рублях за 1 тыс. токенов на 2026-10-17 (GET $OPENAI_BASE_URL/models).
llm:
  enabled: false                         # пока LLM только в крайнем случае (CLAUDE.md)
  model: openai/gpt-oss-120b             # 0.01586 вход / 0.061 выход; рассуждение считается выходом
  fallback_model: null                   # GigaChat не используем
  reasoning_effort: low
  max_cards_per_call: 6
  self_consistency_samples: 1  # 3 ответа на карточку — ≈94 ₽ на 1000 карточек против ≈31 ₽ (прогон 20261018-2130)
  budget_rub: 0                # жёсткий лимит на прогон; 0 — вызовы запрещены
  temperature: 0.7             # для self-consistency; при одном ответе — 0
  max_tokens: 600              # потолок ответа: по нему бюджет оценивается до вызова
  timeout_s: 60                # таймаут одного запроса к API
  max_retries: 2               # повторов после сбоя; дальше — пустой ответ и счётчик api_failures, прогон идёт
  max_description_chars: 2000  # описание в промпте обрезаем
  max_options: 10              # вариантов на атрибут в промпте: сначала кандидаты прошлых шагов, потом частые
  # Где LLM окупается: справочные и размерные атрибуты, где правила находят кандидатов, но не уверены
  # (цвет узора или детали, порядок «ШхВхГ»). Бренд, модель и память правила закрывают сами.
  attrs: [color, material, weight, width, height, depth]
  require_candidate: true      # LLM выбирает из найденных правилами кандидатов по тексту, пустые поля не ищет
  context_chars: 150           # из описания — окна ±150 символов вокруг кандидатов и зацепок, а не 2000 символов
  score: 0.85                  # сырой скор ответа, умножается на долю голосов self-consistency
  cache: llm_cache.sqlite      # data/processed/: одинаковый запрос второй раз не оплачиваем
  # рубли за 1 тыс. токенов: [вход, выход] — по ним считаются llm_cost_rub и бюджет
  prices_rub_per_1k:
    openai/gpt-oss-120b: [0.01586, 0.061]

embeddings:
  backend: local               # временно e5-small на CPU ВМ; api — после сравнения на valid
  model: BAAI/bge-m3           # api-модель, 0.00061 за 1 тыс. токенов
  local_model: intfloat/multilingual-e5-small
  batch_size: 64
  budget_rub: 0
  prices_rub_per_1k:
    BAAI/bge-m3: 0.00061

split:
  seed: 42
  test_share: 0.2
  valid_share: 0.1
  holdout_category_share: 0.1  # категории, целиком отложенные как «новые»
