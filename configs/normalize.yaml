# Параметры нормализатора и правил (блок b2). attr_id — только из configs/attributes.yaml.
# Новый атрибут реестра работает в правилах и парсере без правки кода: достаточно ключевых слов и алиасов здесь.

# Начала слов, по которым число в свободном тексте относится к атрибуту: «вес 1,2 кг», «аккумулятор 5000 мАч».
# Число с единицей в заголовке берётся и без ключевого слова, если единица однозначна для схемы карточки.
keywords:
  storage: [встроенн, rom, пзу, хранилищ]     # «памят» не берём: так же начинается «оперативной памяти»
  ram: [оперативн, озу, ram, ddr, lpddr]
  screen_diag: [диагонал, экран, диспле]
  battery: [аккумулятор, батаре, емкост]
  weight: [вес, масс]
  width: [ширин]
  height: [высот]
  depth: [глубин]
  drive: [ssd, hdd, накопител, диск, emmc, nvme]

# Атрибуты-справочники, которые претендуют на числа с единицей: «512 ГБ» в ноутбуке — может быть и накопитель
unit_consumers:
  drive: GB

# Ключи блоков «ключ: значение» сверх имени атрибута и имён полей фида (их парсер берёт из реестра сам)
aliases:
  brand: [бренд, производитель, торговая марка, марка, brand, manufacturer]
  model: [модель, название модели, model]
  color: [цвет, цвет товара, основной цвет, цвет изделия, color, colour]
  condition: [состояние]
  storage: [встроенная память, объем встроенной памяти, объем памяти, память, rom]
  ram: [оперативная память, объем оперативной памяти, озу, ram]
  screen_diag: [диагональ, диагональ экрана, размер экрана, диагональ дисплея]
  battery: [аккумулятор, емкость аккумулятора, емкость батареи, батарея]
  cpu: [процессор, модель процессора, cpu]
  drive: [накопитель, объем накопителя, общий объем накопителя, ssd, жесткий диск]
  weight: [вес, вес товара, вес изделия, вес нетто, масса]
  width: [ширина, ширина изделия]
  height: [высота, высота изделия]
  depth: [глубина, глубина изделия]
  material: [материал, материал изделия, состав, материал товара]

# Ключ сравнения для атрибутов, у которых канон длиннее записи в тексте (normalize/keys.py)
key_functions:
  cpu: cpu
  drive: drive

# Атрибуты, значения которых склоняются в тексте («черного цвета», «из натуральной кожи»): ищем и по основе слова
inflected: [color, material, condition]

# Написание продавца, которое не совпадает ни с одним каноном, попадает в справочник при стольких голосах эталона
dictionary_min_support: 3

# Ручные синонимы: написание → канон. Добавляются к голосам эталона с весом manual_weight
manual_weight: 20
synonyms:
  color:
    black: черный
    white: белый
    grey: серый
    gray: серый
    silver: серебристый
    gold: золотистый
    golden: золотистый
    blue: синий
    light blue: голубой
    green: зеленый
    red: красный
    pink: розовый
    purple: фиолетовый
    violet: фиолетовый
    yellow: желтый
    orange: оранжевый
    beige: бежевый
    brown: коричневый
    серебряный: серебристый
  condition:
    восстановленный: восстановленный
    уцененный: уцененный
    б/у: бывший в употреблении

# Слова перед брендом, которые говорят о совместимости, а не о производителе: «Чехол для Samsung»
compat_words: [для, for, совместимый, совместим, под]

# Сырые скоры шагов (до калибровки)
scores:
  title: 0.9             # значение из заголовка
  description: 0.6       # значение из описания
  unknown_value: 0.3     # значения нет в справочнике: только на ручную проверку
  partial_match: 0.8     # канон найден внутри значения, а не совпал целиком
  assumed: 0.7           # часть значения достроена правилом (тип накопителя в «16/512GB»)

# Парсер «ключ: значение»: кроме ручных алиасов, ключи выучиваются по train — у офферов с блоками характеристик
parse:
  alias_score: 0.9          # скор пары с ручным алиасом ключа
  learn_min_support: 10     # выученный алиас: сколько карточек с этим ключом и эталоном атрибута
  learn_min_precision: 0.7  # и доля, где значение ключа подтвердило эталон

# Retrieval к справочнику (шаг 4): только для справочных атрибутов, пустых или неуверенных после правил и парсера
retrieval:
  encoder: char             # char — триграммы символов на CPU; эмбеддинги платформы — через llm/client.py (b3)
  attrs: [color, material, cpu, drive, condition]
  min_similarity: 0.75      # косинус запроса и значения справочника
  open_below: 0.7           # атрибут ищем, если у прошлых шагов нет кандидата со скором не ниже
  max_words: 2              # запросы из заголовка — по одному и по два слова
  min_value_support: 3      # значения справочника реже — не в индексе (шум эталона)

# Значение из карточек той же модели (шаг 7): бренд + модель в каноне, эталон фолдов знаний
model_match:
  min_support: 2            # сколько карточек модели с этим атрибутом нужно
  min_share: 0.6            # и какая доля из них должна согласиться
  score: 0.6                # потолок скора: значение не из текста этой карточки
  open_below: 0.7           # атрибут берём, если у прошлых шагов нет кандидата со скором не ниже

# Раскладка заголовка «<что за товар> <бренд> <модель>» и размеров «AxBxC» (выучиваются по train)
title_layout:
  min_prefix_count: 3     # префикс заголовка берём, если он встретился хотя бы у стольких офферов
  max_brand_offset: 2     # бренд ищем не дальше стольких слов после префикса
dimensions:
  min_support: 5          # сколько карточек категории нужно, чтобы выучить раскладку размеров
  min_rate: 0.5           # доля совпадений с эталоном, чтобы позиция числа стала атрибутом
